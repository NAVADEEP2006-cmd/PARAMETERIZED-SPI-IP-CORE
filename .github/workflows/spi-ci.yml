name: Parameterized SPI IP CI

on:
  push:
    branches:
      - main
      - rebuild/spi-ip-core
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verilator-lint:
    name: Verilator RTL & TB Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run Verilator Lint
        run: |
          python3 sim/run_sim.py lint

  unit-tests:
    name: Unit Testbenches (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run Modular Unit Test Suite
        run: |
          python3 sim/run_sim.py unit

  integration-iverilog:
    name: Integration Testbench (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run 16-Suite Integration Testbench
        run: |
          python3 sim/run_sim.py integration

  simulation-verilator:
    name: Verilator Modern Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Verilator & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make g++

      - name: Run Verilator Simulation
        run: |
          python3 sim/run_sim.py sim
